<style>
/* ── main.css ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #161922;
    --surface-2: #1c1f2e;
    --border: #2a2d3e;
    --text: #e2e4ed;
    --text-muted: #8b8fa3;
    --accent: #7c6aef;
    --accent-hover: #6b59de;
    --added-bg: #12261e;
    --added-border: #1a4d2e;
    --added-text: #6fdd8b;
    --added-gutter: #1a3a28;
    --removed-bg: #2a1215;
    --removed-border: #4d1a1f;
    --removed-text: #f47067;
    --removed-gutter: #3a1a1e;
    --highlight-add: rgba(63, 185, 80, 0.25);
    --highlight-remove: rgba(248, 81, 73, 0.25);
    --unchanged-gutter: #1c1f2e;
    --moved-bg: #10222f;
    --moved-text: #58b7e6;
    --moved-gutter: #16344a;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .main-content {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn:hover { background: var(--border); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  .view-toggle {
    display: flex;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .view-toggle button {
    padding: 7px 14px;
    border: none;
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .view-toggle button.active {
    background: var(--accent);
    color: #fff;
  }

  .view-toggle button:not(.active):hover { background: var(--border); }

  /* ── Resize Handle ── */
  .resize-handle {
    height: 6px;
    background: var(--border);
    cursor: row-resize;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s ease;
  }

  .resize-handle:hover, .resize-handle.dragging {
    background: var(--accent);
  }

  .resize-handle::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 32px;
    height: 2px;
    background: var(--text-muted);
    border-radius: 1px;
    opacity: 0.5;
  }

  /* ── Input Area ── */
  .input-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    flex: 1;
    min-height: 0;
  }

  .input-area.has-diff {
    flex: none;
    height: 250px;
    min-height: 80px;
  }

  .input-pane {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-height: 0;
  }

  .input-pane:last-child { border-right: none; }

  .pane-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .pane-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
  }

  .pane-header .char-count {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.7;
    padding: 16px;
    outline: none;
    tab-size: 4;
    min-height: 0;
  }

  textarea::placeholder { color: var(--text-muted); opacity: 0.5; }

  /* ── Diff Output ── */
  .diff-area {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
  }

  .diff-area.visible { display: flex; }

  .diff-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .diff-stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
    font-weight: 500;
  }

  .stat-added { color: var(--added-text); }
  .stat-removed { color: var(--removed-text); }
  .stat-moved { color: var(--moved-text); }
  .stat-unchanged { color: var(--text-muted); }

  .diff-scroll {
    flex: 1;
    overflow: auto;
    min-height: 0;
  }

  /* ── Unified Diff ── */
  .diff-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.7;
  }

  .diff-table td {
    padding: 0 12px;
    white-space: pre-wrap;
    word-break: break-all;
    vertical-align: top;
  }

  .diff-table .line-num {
    width: 50px;
    min-width: 50px;
    text-align: right;
    color: var(--text-muted);
    opacity: 0.5;
    user-select: none;
    padding: 0 8px;
    font-size: 12px;
    border-right: 1px solid var(--border);
  }

  .diff-table .line-type {
    width: 20px;
    min-width: 20px;
    text-align: center;
    user-select: none;
    font-weight: 600;
  }

  .diff-row-added {
    background: var(--added-bg);
  }

  .diff-row-added .line-num { background: var(--added-gutter); }
  .diff-row-added .line-type { color: var(--added-text); background: var(--added-gutter); }
  .diff-row-added .line-content { color: var(--added-text); }

  .diff-row-removed {
    background: var(--removed-bg);
  }

  .diff-row-removed .line-num { background: var(--removed-gutter); }
  .diff-row-removed .line-type { color: var(--removed-text); background: var(--removed-gutter); }
  .diff-row-removed .line-content { color: var(--removed-text); }

  .diff-row-unchanged .line-num { background: var(--unchanged-gutter); }
  .diff-row-unchanged .line-type { background: var(--unchanged-gutter); }

  .diff-row-moved-out,
  .diff-row-moved-in {
    background: var(--moved-bg);
    cursor: pointer;
  }

  .diff-row-moved-out .line-num, .diff-row-moved-in .line-num { background: var(--moved-gutter); }
  .diff-row-moved-out .line-type, .diff-row-moved-in .line-type { color: var(--moved-text); background: var(--moved-gutter); }
  .diff-row-moved-out .line-content, .diff-row-moved-in .line-content { color: var(--moved-text); }

  /* Split view has no line-type cell — badge the line-num gutter instead. */
  .diff-side .diff-row-moved-out .line-num::after,
  .diff-side .diff-row-moved-in .line-num::after {
    content: '\21C5';
    margin-left: 4px;
    color: var(--moved-text);
    opacity: 0.7;
  }

  .diff-row-separator td {
    background: var(--surface-2);
    color: var(--text-muted);
    text-align: center;
    padding: 4px 12px;
    font-size: 12px;
    font-style: italic;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .char-highlight-add { background: var(--highlight-add); border-radius: 2px; }
  .char-highlight-remove { background: var(--highlight-remove); border-radius: 2px; }

  /* ── Side-by-side ── */
  .diff-side-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100%;
  }

  .diff-side {
    border-right: 1px solid var(--border);
    min-width: 0;
  }

  .diff-side:last-child { border-right: none; }

  .diff-side-header {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
  }

  .diff-side table {
    width: 100%;
  }

  .diff-side .line-num { width: 45px; min-width: 45px; }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-muted);
    text-align: center;
    gap: 12px;
    flex: 1;
  }

  .empty-state svg { opacity: 0.3; }

  .empty-state p {
    font-size: 14px;
    max-width: 320px;
  }

  /* ── Diff Navigation ── */
  .diff-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .diff-nav .btn {
    padding: 6px 12px;
    font-size: 12px;
  }

  .diff-nav-label {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 40px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ── Diff Scroll Wrapper (scroll + minimap) ── */
  .diff-scroll-wrapper {
    display: flex;
    flex: 1;
    min-height: 0;
    position: relative;
  }

  /* ── Minimap ── */
  .diff-minimap {
    width: 20px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    position: relative;
    cursor: pointer;
  }

  .minimap-marker {
    position: absolute;
    left: 2px;
    right: 2px;
    min-height: 2px;
    border-radius: 1px;
  }

  .minimap-marker.added { background: var(--added-text); opacity: 0.7; }
  .minimap-marker.removed { background: var(--removed-text); opacity: 0.7; }
  .minimap-marker.moved { background: var(--moved-text); opacity: 0.7; }

  .minimap-viewport {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    pointer-events: none;

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ── Responsive ── */
  @media (max-width: 768px) {

    .input-area { grid-template-columns: 1fr; }
    .input-pane { border-right: none !important; border-bottom: 1px solid var(--border); }
    .diff-side-wrapper { grid-template-columns: 1fr; }
    .diff-side { border-right: none !important; border-bottom: 1px solid var(--border); }
  }

/* ── features.css ── */
/* ── Feature styles: popover, dropdown, collapse, drop overlay, toasts, notices ── */

/* Author display rules (flex etc.) must not defeat the hidden attribute */
[hidden] { display: none !important; }

/* Header needs to anchor the settings popover, and wrap for the inline options bar */
header { position: relative; flex-wrap: wrap; }

/* ── Inline options bar (wide screens): same element, laid out as a header row ── */
.settings-popover.inline {
  position: static;
  width: 100%;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  margin-top: 12px;
  padding: 10px 0 0;
  border: none;
  border-top: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.settings-popover.inline .popover-row {
  justify-content: flex-start;
  gap: 8px;
}

.settings-popover.inline .popover-sub { padding-left: 0; }

.btn-icon {
  padding: 8px 12px;
  font-size: 14px;
  line-height: 1;
}

/* ── Settings popover ── */
.settings-popover {
  position: absolute;
  top: calc(100% + 8px);
  right: 28px;
  z-index: 20;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.popover-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.popover-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.3px;
}

.popover-select, .popover-num {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
  max-width: 160px;
}

.popover-num { width: 56px; text-align: center; }

.popover-select:focus, .popover-num:focus { border-color: var(--accent); }

.popover-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}

.popover-check input {
  accent-color: var(--accent);
  width: 14px;
  height: 14px;
  cursor: pointer;
}

.popover-sub { padding-left: 22px; }

.seg-control {
  display: flex;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.seg-control button {
  padding: 5px 10px;
  border: none;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
}

.seg-control button.active { background: var(--accent); color: #fff; }
.seg-control button:not(.active):hover { background: var(--border); }

/* ── Pane header extras ── */
.pane-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.pane-file {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--accent);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 4px 1px 8px;
  max-width: 220px;
}

.pane-file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-clear {
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0 4px;
  line-height: 1.4;
}

.file-clear:hover { color: var(--removed-text); }

.pane-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-sm {
  padding: 3px 10px;
  font-size: 11px;
  border-radius: 6px;
}

/* ── Drag & drop ── */
.input-pane { position: relative; }

.input-pane.drop-target::after {
  content: 'Drop file to load';
  position: absolute;
  inset: 6px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: rgba(124, 106, 239, 0.12);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
}

/* ── Patch mode ── */
.app.patch-mode .input-area { grid-template-columns: 1fr; }
.app.patch-mode .input-pane[data-side="right"] { display: none; }
.app.patch-mode .input-pane[data-side="left"] { border-right: none; }

/* ── Collapse unchanged ── */
.collapse-hidden { display: none; }

.diff-row-collapse td {
  background: var(--surface-2);
  color: var(--accent);
  text-align: center;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  user-select: none;
}

.diff-row-collapse:hover td { background: var(--border); color: var(--text); }

/* ── Patch view rows ── */
.diff-row-file td {
  background: var(--surface);
  color: var(--text);
  font-weight: 700;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.diff-row-meta td {
  color: var(--text-muted);
  font-size: 12px;
  padding: 1px 12px;
  opacity: 0.8;
}

.no-newline-marker {
  color: var(--removed-text);
  opacity: 0.7;
  margin-left: 4px;
  user-select: none;
}

/* ── Diff toolbar extras ── */
.toolbar-left, .toolbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.lang-chip {
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--accent);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 10px;
  cursor: pointer;
  letter-spacing: 0.4px;
}

.lang-chip:hover { border-color: var(--accent); }

/* ── Export dropdown ── */
.export-wrap { position: relative; }

.export-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 20;
  min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
}

.export-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

.export-dropdown button:hover { background: var(--surface-2); }

/* ── Notices ── */
#noticeArea:not(:empty) { padding: 8px 16px 0; }

.notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  margin-bottom: 8px;
}

.notice-error { border-left-color: var(--removed-text); }

.notice-close {
  border: none;
  background: none;
  color: var(--text-muted);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
  flex-shrink: 0;
}

.notice-close:hover { color: var(--text); }

/* ── Toasts ── */
#toastArea {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 16px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  max-width: 480px;
  text-align: center;
}

.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 768px) {
  .settings-popover { right: 12px; left: 12px; width: auto; }
}

/* ── hljs-theme.css ── */
/* highlight.js token theme, scoped under .line-content so it cannot leak.
   Colors only — no backgrounds — so diff row tints (#12261e / #2a1215) and
   .char-highlight-* overlays always show through. Token colors are kept
   clearly apart from the add/remove marks (--added-text #6fdd8b,
   --removed-text #f47067): strings are teal rather than green, and pinks
   stay far from the removal red. */

.line-content .hljs-keyword,
.line-content .hljs-name,
.line-content .hljs-selector-tag { color: #b39afd; }

.line-content .hljs-string,
.line-content .hljs-regexp { color: #5ec6d8; }

.line-content .hljs-number,
.line-content .hljs-literal,
.line-content .hljs-symbol,
.line-content .hljs-bullet { color: #e0b163; }

.line-content .hljs-comment,
.line-content .hljs-doctag { color: var(--text-muted); font-style: italic; }

.line-content .hljs-title,
.line-content .hljs-title.function_,
.line-content .hljs-section,
.line-content .hljs-selector-id { color: #86b4f7; }

.line-content .hljs-title.class_,
.line-content .hljs-type,
.line-content .hljs-built_in,
.line-content .hljs-selector-class { color: #74d4e7; }

.line-content .hljs-attr,
.line-content .hljs-attribute,
.line-content .hljs-property { color: #e3a6cd; }

.line-content .hljs-variable,
.line-content .hljs-template-variable,
.line-content .hljs-params,
.line-content .hljs-subst { color: #d5d9ea; }

.line-content .hljs-meta,
.line-content .hljs-tag,
.line-content .hljs-operator,
.line-content .hljs-punctuation { color: #9aa0b8; }

.line-content .hljs-emphasis { font-style: italic; }

.line-content .hljs-strong { font-weight: 700; }

.line-content .hljs-addition { color: var(--added-text, #6fdd8b); }

.line-content .hljs-deletion { color: var(--removed-text, #f47067); }

</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 4h12M2 8h8M2 12h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span>Diff Checker</span>
    </div>
    <div class="controls">
      <div class="view-toggle" id="modeToggle">
        <button class="active" data-mode="text">Text</button>
        <button data-mode="json">JSON</button>
        <button data-mode="patch">Patch</button>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button class="active" data-view="unified">Unified</button>
        <button data-view="split">Split</button>
      </div>
      <button class="btn btn-icon" id="settingsBtn" title="Diff options">&#9881;</button>
      <button class="btn" id="swapBtn" title="Swap left and right">&#8644; Swap</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn btn-primary" id="diffBtn">Compare</button>
    </div>

    <div class="settings-popover" id="settingsPopover" hidden>
      <div class="popover-row">
        <span class="popover-label">Granularity</span>
        <div class="seg-control">
          <button data-gran="line">Line</button><button data-gran="word">Word</button><button data-gran="char">Char</button>
        </div>
      </div>
      <div class="popover-row">
        <label class="popover-label" for="optWhitespace">Whitespace</label>
        <select id="optWhitespace" class="popover-select">
          <option value="none">Compare exactly</option>
          <option value="trim">Ignore leading/trailing</option>
          <option value="all">Ignore all whitespace</option>
        </select>
      </div>
      <div class="popover-row" id="langRow">
        <label class="popover-label" for="langSelect">Language</label>
        <select id="langSelect" class="popover-select"></select>
      </div>
      <label class="popover-check"><input type="checkbox" id="optIgnoreCase"> Ignore case</label>
      <label class="popover-check"><input type="checkbox" id="optDetectMoves"> Detect moved lines</label>
      <label class="popover-check"><input type="checkbox" id="optIgnoreComments"> Ignore comments</label>
      <label class="popover-check"><input type="checkbox" id="optAutoCompare"> Live compare (as you type)</label>
      <label class="popover-check"><input type="checkbox" id="optCollapse"> Collapse unchanged lines</label>
      <div class="popover-row popover-sub">
        <label class="popover-label" for="optContext">Context lines</label>
        <input type="number" id="optContext" class="popover-num" min="1" max="10" value="3">
      </div>
      <label class="popover-check"><input type="checkbox" id="optSyncScroll"> Sync input scrolling</label>
    </div>
  </header>

  <div class="main-content" id="mainContent">
    <div id="noticeArea"></div>
    <div class="input-area" id="inputArea">
      <div class="input-pane" data-side="left">
        <div class="pane-header" data-side="left">
          <div class="pane-title">
            <span class="pane-label" id="leftPaneLabel">Original</span>
            <span class="pane-file" id="leftFile" hidden><span class="pane-file-name"></span><button class="file-clear" data-side="left" title="Detach filename">&times;</button></span>
          </div>
          <div class="pane-actions">
            <button class="btn btn-sm pane-open" data-side="left" title="Open a file">Open&hellip;</button>
            <span class="char-count" id="leftCount">0 chars</span>
          </div>
        </div>
        <textarea id="leftInput" placeholder="Paste original text here..." spellcheck="false"></textarea>
        <input type="file" id="leftFileInput" hidden>
      </div>
      <div class="input-pane" data-side="right" id="rightPane">
        <div class="pane-header" data-side="right">
          <div class="pane-title">
            <span class="pane-label" id="rightPaneLabel">Modified</span>
            <span class="pane-file" id="rightFile" hidden><span class="pane-file-name"></span><button class="file-clear" data-side="right" title="Detach filename">&times;</button></span>
          </div>
          <div class="pane-actions">
            <button class="btn btn-sm pane-open" data-side="right" title="Open a file">Open&hellip;</button>
            <span class="char-count" id="rightCount">0 chars</span>
          </div>
        </div>
        <textarea id="rightInput" placeholder="Paste modified text here..." spellcheck="false"></textarea>
        <input type="file" id="rightFileInput" hidden>
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle" style="display:none;"></div>

    <div class="diff-area" id="diffArea">
      <div class="diff-toolbar">
        <div class="toolbar-left">
          <div class="diff-stats" id="diffStats"></div>
          <button class="lang-chip" id="langChip" hidden title="Detected language — click to change"></button>
        </div>
        <div class="toolbar-right">
          <div class="export-wrap">
            <button class="btn" id="exportBtn">Export &#9662;</button>
            <div class="export-dropdown" id="exportDropdown" hidden>
              <button data-export="copy-patch">Copy as patch</button>
              <button data-export="download-patch">Download .patch</button>
              <button data-export="report">Download HTML report</button>
              <button data-export="share">Copy share link</button>
            </div>
          </div>
          <div class="diff-nav">
            <button class="btn" id="prevDiffBtn" title="Previous change (Alt+&#8593;)">&#9650; Prev</button>
            <span class="diff-nav-label" id="diffNavLabel"></span>
            <button class="btn" id="nextDiffBtn" title="Next change (Alt+&#8595;)">&#9660; Next</button>
          </div>
        </div>
      </div>
      <div class="diff-scroll-wrapper">
        <div class="diff-scroll" id="diffScroll"></div>
        <div class="diff-minimap" id="diffMinimap">
          <div class="minimap-viewport" id="minimapViewport"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toastArea"></div>

<script>
(function () {
'use strict';
// ──────────── src/js/state.js ────────────
// ── DOM references ──
const leftInput = document.getElementById('leftInput');
const rightInput = document.getElementById('rightInput');
const leftCount = document.getElementById('leftCount');
const rightCount = document.getElementById('rightCount');
const diffBtn = document.getElementById('diffBtn');
const clearBtn = document.getElementById('clearBtn');
const swapBtn = document.getElementById('swapBtn');
const inputArea = document.getElementById('inputArea');
const diffArea = document.getElementById('diffArea');
const diffScroll = document.getElementById('diffScroll');
const diffStats = document.getElementById('diffStats');
const viewToggle = document.getElementById('viewToggle');
const modeToggle = document.getElementById('modeToggle');
const resizeHandle = document.getElementById('resizeHandle');
const prevDiffBtn = document.getElementById('prevDiffBtn');
const nextDiffBtn = document.getElementById('nextDiffBtn');
const diffNavLabel = document.getElementById('diffNavLabel');
const diffMinimap = document.getElementById('diffMinimap');
const minimapViewport = document.getElementById('minimapViewport');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPopover = document.getElementById('settingsPopover');
const langChip = document.getElementById('langChip');
const langSelect = document.getElementById('langSelect');
const exportBtn = document.getElementById('exportBtn');
const exportDropdown = document.getElementById('exportDropdown');
const noticeArea = document.getElementById('noticeArea');
const toastArea = document.getElementById('toastArea');
const leftPaneLabel = document.getElementById('leftPaneLabel');
const rightPane = document.getElementById('rightPane');

// ── Persisted settings ──
const SETTINGS_KEY = 'diffchecker:settings:v1';
const INPUTS_KEY = 'diffchecker:inputs:v1';
const INPUT_SAVE_LIMIT = 2 * 1024 * 1024; // per side

const settings = {
  view: 'unified',            // 'unified' | 'split'
  mode: 'text',               // 'text' | 'json' | 'patch'
  granularity: 'word',        // 'line' | 'word' | 'char'
  ignoreWhitespace: 'none',   // 'none' | 'trim' | 'all'
  ignoreCase: false,
  detectMoves: true,          // tag relocated lines/blocks instead of +/-
  ignoreComments: false,      // hide comment-only changes (needs a resolved language)
  collapseUnchanged: false,
  contextLines: 3,
  autoCompare: false,
  syncInputScroll: false,
  language: 'auto',           // 'auto' | 'plain' | hljs language id
};

// ── Per-compare session state (not persisted) ──
const session = {
  leftName: null,
  rightName: null,
  lastDiff: null,
  lastPatch: null,
  activeLang: null,
  hlOld: null,
  hlNew: null,
  changeGroups: [],
  currentChangeIdx: -1,
  suppressInputSave: false,   // true right after loading from a share link
};

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return;
    for (const key of Object.keys(settings)) {
      if (key in saved) settings[key] = saved[key];
    }
  } catch (e) { /* private mode / quota — settings stay at defaults */ }
}

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* ignore */ }
}

function saveInputs() {
  if (session.suppressInputSave) return;
  try {
    if (leftInput.value.length > INPUT_SAVE_LIMIT || rightInput.value.length > INPUT_SAVE_LIMIT) return;
    localStorage.setItem(INPUTS_KEY, JSON.stringify({
      l: leftInput.value,
      r: rightInput.value,
      ln: session.leftName,
      rn: session.rightName,
    }));
  } catch (e) { /* ignore */ }
}

function restoreInputs() {
  try {
    const raw = localStorage.getItem(INPUTS_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return;
    if (typeof saved.l === 'string') leftInput.value = saved.l;
    if (typeof saved.r === 'string') rightInput.value = saved.r;
    session.leftName = typeof saved.ln === 'string' ? saved.ln : null;
    session.rightName = typeof saved.rn === 'string' ? saved.rn : null;
  } catch (e) { /* ignore */ }
}

function clearSavedInputs() {
  try { localStorage.removeItem(INPUTS_KEY); } catch (e) { /* ignore */ }
}

// ──────────── src/js/diff-core.js ────────────
// ── Diff engine (pure — no DOM) ──

const DIFF_MAX_D = 3000;       // Myers depth cap for line diffs
const INLINE_MAX_CHARS = 3000; // skip inline marks beyond this line length
const INLINE_MAX_D = 1500;     // Myers depth cap for inline token diffs

function splitLines(text) {
  if (text === '') return { lines: [], eol: true };
  const eol = text.endsWith('\n');
  const body = eol ? text.slice(0, -1) : text;
  return { lines: body.split('\n'), eol };
}

function normKey(line, opts) {
  let key = line;
  if (opts.ignoreWhitespace === 'trim') key = key.trim();
  else if (opts.ignoreWhitespace === 'all') key = key.replace(/\s+/g, '');
  if (opts.ignoreCase) key = key.toLowerCase();
  return key;
}

// Myers O(ND) diff over arrays of comparable values.
// Returns ordered ops [{type:'equal',oldIdx,newIdx}|{type:'delete',oldIdx}|{type:'insert',newIdx}],
// or null when the edit distance exceeds maxD (caller falls back to block replacement).
function myersDiff(a, b, maxD) {
  const N = a.length;
  const M = b.length;
  const total = N + M;
  if (total === 0) return [];
  const cap = maxD == null ? total : Math.min(maxD, total);
  const off = cap;
  const v = new Int32Array(2 * cap + 1);
  const trace = [];

  for (let d = 0; d <= cap; d++) {
    // Snapshot only the k-range this depth can read (|k| <= d).
    trace.push(v.slice(off - d, off + d + 1));
    for (let k = -d; k <= d; k += 2) {
      let x;
      if (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) {
        x = v[off + k + 1];
      } else {
        x = v[off + k - 1] + 1;
      }
      let y = x - k;
      while (x < N && y < M && a[x] === b[y]) { x++; y++; }
      v[off + k] = x;
      if (x >= N && y >= M) return myersBacktrack(trace, a, b);
    }
  }
  return null;
}

function myersBacktrack(trace, a, b) {
  let x = a.length;
  let y = b.length;
  const ops = [];

  for (let d = trace.length - 1; d > 0; d--) {
    const v = trace[d]; // snapshot covering k in [-d, d], indexed by k + d
    const k = x - y;
    let prevK;
    if (k === -d || (k !== d && v[k - 1 + d] < v[k + 1 + d])) {
      prevK = k + 1;
    } else {
      prevK = k - 1;
    }
    const prevX = v[prevK + d];
    const prevY = prevX - prevK;

    while (x > prevX && y > prevY) {
      ops.push({ type: 'equal', oldIdx: x - 1, newIdx: y - 1 });
      x--; y--;
    }

    if (x === prevX) {
      ops.push({ type: 'insert', newIdx: y - 1 });
      y--;
    } else {
      ops.push({ type: 'delete', oldIdx: x - 1 });
      x--;
    }
  }

  // d === 0: whatever remains is the common leading snake.
  while (x > 0 && y > 0) {
    ops.push({ type: 'equal', oldIdx: x - 1, newIdx: y - 1 });
    x--; y--;
  }

  ops.reverse();
  return ops;
}

// Key-source text for a line under ignore-comments. Untouched lines keep
// their exact text (indentation stays significant); a line stripping emptied
// becomes '', and a trailing removed comment doesn't leave phantom
// whitespace behind.
function commentKeySource(raw, src) {
  if (src === raw) return raw;
  if (/^\s*$/.test(src)) return '';
  return src.replace(/\s+$/, '');
}

// Full line-level diff with normalization options.
// opts: { ignoreWhitespace: 'none'|'trim'|'all', ignoreCase: bool, maxD?: number,
//         detectMoves?: bool, aKeySource?: string[], bKeySource?: string[] }
// aKeySource/bKeySource: per-line comment-stripped text (from stripComments);
// keys are built from them while the original lines are what's displayed.
function computeDiff(aText, bText, opts) {
  opts = opts || {};
  const sa = splitLines(aText);
  const sb = splitLines(bText);
  const oldLines = sa.lines;
  const newLines = sb.lines;
  const aSrc = (opts.aKeySource && opts.aKeySource.length === oldLines.length &&
                opts.bKeySource && opts.bKeySource.length === newLines.length)
    ? opts.aKeySource : null;
  const bSrc = aSrc ? opts.bKeySource : null;
  const plain = !aSrc && opts.ignoreWhitespace !== 'trim' && opts.ignoreWhitespace !== 'all' && !opts.ignoreCase;
  const aKeys = aSrc ? oldLines.map((l, i) => normKey(commentKeySource(l, aSrc[i]), opts))
    : (plain ? oldLines : oldLines.map(l => normKey(l, opts)));
  const bKeys = bSrc ? newLines.map((l, i) => normKey(commentKeySource(l, bSrc[i]), opts))
    : (plain ? newLines : newLines.map(l => normKey(l, opts)));
  // Ignorable = stripping emptied a non-blank line (a pure comment line).
  // Raw blank lines are never ignorable, so blank-line edits stay changes.
  const aDrop = aSrc ? oldLines.map((l, i) => aSrc[i] !== l && commentKeySource(l, aSrc[i]) === '') : null;
  const bDrop = bSrc ? newLines.map((l, i) => bSrc[i] !== l && commentKeySource(l, bSrc[i]) === '') : null;

  // Trim common prefix/suffix so Myers only sees the changed middle.
  let pre = 0;
  const minLen = Math.min(aKeys.length, bKeys.length);
  while (pre < minLen && aKeys[pre] === bKeys[pre]) pre++;
  let suf = 0;
  while (suf < minLen - pre && aKeys[aKeys.length - 1 - suf] === bKeys[bKeys.length - 1 - suf]) suf++;

  const midA = aKeys.slice(pre, aKeys.length - suf);
  const midB = bKeys.slice(pre, bKeys.length - suf);
  let midOps = myersDiff(midA, midB, opts.maxD == null ? DIFF_MAX_D : opts.maxD);
  let truncated = false;
  if (midOps === null) {
    truncated = true;
    midOps = [];
    for (let i = 0; i < midA.length; i++) midOps.push({ type: 'delete', oldIdx: i });
    for (let j = 0; j < midB.length; j++) midOps.push({ type: 'insert', newIdx: j });
  }

  const ops = [];
  for (let i = 0; i < pre; i++) ops.push({ type: 'equal', oldIdx: i, newIdx: i });
  for (const op of midOps) {
    if (op.type === 'equal') ops.push({ type: 'equal', oldIdx: op.oldIdx + pre, newIdx: op.newIdx + pre });
    else if (op.type === 'delete') ops.push({ type: 'delete', oldIdx: op.oldIdx + pre });
    else ops.push({ type: 'insert', newIdx: op.newIdx + pre });
  }
  for (let s = suf; s > 0; s--) {
    ops.push({ type: 'equal', oldIdx: aKeys.length - s, newIdx: bKeys.length - s });
  }

  // Under 'all', the joined-key comparison (on stripped keys when a key
  // source is present) subsumes the comment-only sequence rule.
  let finalOps = ops;
  if (opts.ignoreWhitespace === 'all') finalOps = mergeWhitespaceOnlyRuns(ops, aKeys, bKeys);
  else if (aSrc) finalOps = mergeCommentOnlyRuns(ops, aKeys, bKeys, aDrop, bDrop);
  if (opts.detectMoves) detectMoves(finalOps, aKeys, bKeys);

  return { oldLines, newLines, oldEol: sa.eol, newEol: sb.eol, ops: finalOps, truncated };
}

// Under ignore-comments, a change run whose non-ignorable lines match 1:1 in
// order is comment-only churn. Sequence comparison (not concatenation) keeps
// code rewrapping a real diff under 'none'/'trim'. Kept lines pair two-sided,
// comment lines pair comment-with-comment, and surplus comment lines become
// one-sided equal ops. All-or-nothing per run: a run mixing a real code edit
// with comment churn stays fully visible.
function mergeCommentOnlyRuns(ops, aKeys, bKeys, aDrop, bDrop) {
  const out = [];
  let i = 0;
  while (i < ops.length) {
    if (ops[i].type === 'equal') { out.push(ops[i]); i++; continue; }
    let j = i;
    while (j < ops.length && ops[j].type !== 'equal') j++;
    const run = ops.slice(i, j);
    const dels = run.filter(o => o.type === 'delete');
    const ins = run.filter(o => o.type === 'insert');
    const oldSeq = dels.filter(o => !aDrop[o.oldIdx]);
    const newSeq = ins.filter(o => !bDrop[o.newIdx]);
    let match = oldSeq.length === newSeq.length;
    for (let k = 0; match && k < oldSeq.length; k++) {
      if (aKeys[oldSeq[k].oldIdx] !== bKeys[newSeq[k].newIdx]) match = false;
    }
    if (match) {
      let di = 0;
      let ni = 0;
      while (di < dels.length || ni < ins.length) {
        const dIgn = di < dels.length && aDrop[dels[di].oldIdx];
        const nIgn = ni < ins.length && bDrop[ins[ni].newIdx];
        if (dIgn && nIgn) {
          out.push({ type: 'equal', oldIdx: dels[di++].oldIdx, newIdx: ins[ni++].newIdx });
        } else if (dIgn) {
          out.push({ type: 'equal', oldIdx: dels[di++].oldIdx });
        } else if (nIgn) {
          out.push({ type: 'equal', newIdx: ins[ni++].newIdx });
        } else {
          out.push({ type: 'equal', oldIdx: dels[di++].oldIdx, newIdx: ins[ni++].newIdx });
        }
      }
    } else {
      for (const o of run) out.push(o);
    }
    i = j;
  }
  return out;
}

const MOVE_TRIVIAL_MIN = 3;

// Trivial lines (blanks, braces, lone punctuation) can't anchor a move on
// their own — they only join a block when adjacent lines match too.
function moveTrivialKey(key) {
  const t = key.replace(/\s+/g, '');
  return t.length < MOVE_TRIVIAL_MIN || !/[A-Za-z0-9]/.test(t);
}

// Tag delete/insert pairs that are really relocations. A line anchors a move
// when its key appears exactly once among deletes and once among inserts;
// each anchor then grows up and down by consecutive line numbers on both
// sides, sweeping adjacent matching lines (trivial ones included) into one
// block. Ops keep their type — they gain moveId (shared per block) plus
// moveTo (on deletes) / moveFrom (on inserts) pointing at the partner line.
function detectMoves(ops, aKeys, bKeys) {
  const delOps = [];
  const insOps = [];
  for (const op of ops) {
    if (op.type === 'delete') delOps.push(op);
    else if (op.type === 'insert') insOps.push(op);
  }
  if (delOps.length === 0 || insOps.length === 0) return;

  const delByKey = new Map();
  const insByKey = new Map();
  const delByOld = new Map();
  const insByNew = new Map();
  for (const op of delOps) {
    const k = aKeys[op.oldIdx];
    if (!delByKey.has(k)) delByKey.set(k, []);
    delByKey.get(k).push(op);
    delByOld.set(op.oldIdx, op);
  }
  for (const op of insOps) {
    const k = bKeys[op.newIdx];
    if (!insByKey.has(k)) insByKey.set(k, []);
    insByKey.get(k).push(op);
    insByNew.set(op.newIdx, op);
  }

  const anchors = [];
  for (const [key, dels] of delByKey) {
    if (dels.length !== 1) continue;
    const ins = insByKey.get(key);
    if (!ins || ins.length !== 1) continue;
    if (moveTrivialKey(key)) continue;
    anchors.push([dels[0], ins[0]]);
  }
  anchors.sort((p, q) => p[0].oldIdx - q[0].oldIdx);

  let nextMoveId = 0;
  const pairMove = (d, ins, id) => {
    d.moveId = id; d.moveTo = ins.newIdx;
    ins.moveId = id; ins.moveFrom = d.oldIdx;
  };
  for (const [d0, i0] of anchors) {
    if (d0.moveId != null || i0.moveId != null) continue;
    const id = nextMoveId++;
    pairMove(d0, i0, id);
    for (let o = d0.oldIdx - 1, n = i0.newIdx - 1; ; o--, n--) {
      const d = delByOld.get(o);
      const ins = insByNew.get(n);
      if (!d || !ins || d.moveId != null || ins.moveId != null) break;
      if (aKeys[o] !== bKeys[n]) break;
      pairMove(d, ins, id);
    }
    for (let o = d0.oldIdx + 1, n = i0.newIdx + 1; ; o++, n++) {
      const d = delByOld.get(o);
      const ins = insByNew.get(n);
      if (!d || !ins || d.moveId != null || ins.moveId != null) break;
      if (aKeys[o] !== bKeys[n]) break;
      pairMove(d, ins, id);
    }
  }
}

// Under ignoreWhitespace 'all', a newline is whitespace too: a change run that
// only redistributes content across line boundaries ("}\nelse {" vs "} else {")
// or adds/removes blank lines is not a real change. Detect such runs by
// concatenating each side's normalized keys; when they match, replace the run
// with equal ops. Lines pair up 1:1 in order; the longer side's leftovers
// become one-sided equal ops carrying only oldIdx or only newIdx.
function mergeWhitespaceOnlyRuns(ops, aKeys, bKeys) {
  const out = [];
  let i = 0;
  while (i < ops.length) {
    if (ops[i].type === 'equal') { out.push(ops[i]); i++; continue; }
    let j = i;
    while (j < ops.length && ops[j].type !== 'equal') j++;
    const run = ops.slice(i, j);
    const dels = run.filter(o => o.type === 'delete');
    const ins = run.filter(o => o.type === 'insert');
    let oldJoined = '';
    for (const o of dels) oldJoined += aKeys[o.oldIdx];
    let newJoined = '';
    for (const o of ins) newJoined += bKeys[o.newIdx];
    if (oldJoined === newJoined) {
      const n = Math.max(dels.length, ins.length);
      for (let k = 0; k < n; k++) {
        const op = { type: 'equal' };
        if (k < dels.length) op.oldIdx = dels[k].oldIdx;
        if (k < ins.length) op.newIdx = ins[k].newIdx;
        out.push(op);
      }
    } else {
      for (const o of run) out.push(o);
    }
    i = j;
  }
  return out;
}

// Character-offset ranges of the differing parts of a paired old/new line.
// granularity: 'line' (no inline marks) | 'word' | 'char'
// Returns { oldRanges: [{start,end}], newRanges: [{start,end}] } with adjacent ranges merged.
function inlineDiffRanges(oldStr, newStr, granularity) {
  const empty = { oldRanges: [], newRanges: [] };
  if (granularity === 'line' || oldStr === newStr) return empty;
  if (oldStr.length > INLINE_MAX_CHARS || newStr.length > INLINE_MAX_CHARS) return empty;

  const oldTokens = granularity === 'char' ? Array.from(oldStr) : (oldStr.match(/\S+|\s+/g) || []);
  const newTokens = granularity === 'char' ? Array.from(newStr) : (newStr.match(/\S+|\s+/g) || []);
  const ops = myersDiff(oldTokens, newTokens, INLINE_MAX_D);
  if (ops === null) {
    // Too different — mark whole lines.
    return {
      oldRanges: oldStr ? [{ start: 0, end: oldStr.length }] : [],
      newRanges: newStr ? [{ start: 0, end: newStr.length }] : [],
    };
  }

  const oldRanges = [];
  const newRanges = [];
  let oPos = 0;
  let nPos = 0;
  for (const op of ops) {
    if (op.type === 'equal') {
      oPos += oldTokens[op.oldIdx].length;
      nPos += newTokens[op.newIdx].length;
    } else if (op.type === 'delete') {
      const len = oldTokens[op.oldIdx].length;
      pushRange(oldRanges, oPos, oPos + len);
      oPos += len;
    } else {
      const len = newTokens[op.newIdx].length;
      pushRange(newRanges, nPos, nPos + len);
      nPos += len;
    }
  }
  return { oldRanges, newRanges };
}

function pushRange(ranges, start, end) {
  const last = ranges[ranges.length - 1];
  if (last && last.end === start) last.end = end;
  else ranges.push({ start, end });
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { splitLines, normKey, myersDiff, computeDiff, inlineDiffRanges, esc, DIFF_MAX_D, detectMoves, moveTrivialKey, commentKeySource, mergeCommentOnlyRuns };
}

// ──────────── src/js/patch.js ────────────
// Unified patch generation and parsing.
// generateUnifiedPatch serializes the app's diff object to a unified diff;
// parseUnifiedPatch tolerantly parses a unified diff pasted by the user.

function generateUnifiedPatch(diff, opts) {
  const options = opts || {};
  const context = options.context === undefined ? 3 : options.context;
  const oldName = options.oldName === undefined ? 'original' : options.oldName;
  const newName = options.newName === undefined ? 'modified' : options.newName;
  // One-sided equal ops (whitespace-only line joins/splits under the
  // ignore-all-whitespace option) cannot become context lines — a context line
  // consumes one line on both sides — so emit them as real changes.
  const ops = diff.ops.map(op => {
    if (op.type !== 'equal') return op;
    if (op.oldIdx == null) return { type: 'insert', newIdx: op.newIdx };
    if (op.newIdx == null) return { type: 'delete', oldIdx: op.oldIdx };
    return op;
  });
  const header = '--- a/' + oldName + '\n+++ b/' + newName + '\n';

  // Cumulative line counts consumed on each side before op k.
  const oldAt = new Array(ops.length + 1);
  const newAt = new Array(ops.length + 1);
  oldAt[0] = 0;
  newAt[0] = 0;
  for (let k = 0; k < ops.length; k++) {
    oldAt[k + 1] = oldAt[k] + (ops[k].type === 'insert' ? 0 : 1);
    newAt[k + 1] = newAt[k] + (ops[k].type === 'delete' ? 0 : 1);
  }

  // Regions of op indices [lo, hi]: each change run padded with up to
  // `context` equal ops; regions that overlap or touch are merged.
  const regions = [];
  let i = 0;
  while (i < ops.length) {
    if (ops[i].type === 'equal') {
      i++;
      continue;
    }
    let j = i;
    while (j + 1 < ops.length && ops[j + 1].type !== 'equal') j++;
    const lo = Math.max(0, i - context);
    const hi = Math.min(ops.length - 1, j + context);
    const last = regions[regions.length - 1];
    if (last && lo <= last[1] + 1) {
      last[1] = Math.max(last[1], hi);
    } else {
      regions.push([lo, hi]);
    }
    i = j + 1;
  }
  if (regions.length === 0) return header;

  const markOld = !diff.oldEol && diff.oldLines.length > 0;
  const markNew = !diff.newEol && diff.newLines.length > 0;
  const lastOld = diff.oldLines.length - 1;
  const lastNew = diff.newLines.length - 1;

  const lines = [];
  const pushLine = (prefix, text, needsMarker) => {
    lines.push(prefix + text);
    if (needsMarker) lines.push('\\ No newline at end of file');
  };

  for (const region of regions) {
    const lo = region[0];
    const hi = region[1];
    const oldCount = oldAt[hi + 1] - oldAt[lo];
    const newCount = newAt[hi + 1] - newAt[lo];
    const oldStart = oldCount > 0 ? oldAt[lo] + 1 : oldAt[lo];
    const newStart = newCount > 0 ? newAt[lo] + 1 : newAt[lo];
    lines.push('@@ -' + oldStart + ',' + oldCount + ' +' + newStart + ',' + newCount + ' @@');

    let k = lo;
    while (k <= hi) {
      const op = ops[k];
      if (op.type === 'equal') {
        const marker = (markOld && op.oldIdx === lastOld) || (markNew && op.newIdx === lastNew);
        pushLine(' ', diff.oldLines[op.oldIdx], marker);
        k++;
        continue;
      }
      // Change run: emit deletes before inserts, each side in op order.
      let r = k;
      while (r < hi && ops[r + 1].type !== 'equal') r++;
      for (let q = k; q <= r; q++) {
        if (ops[q].type === 'delete') {
          pushLine('-', diff.oldLines[ops[q].oldIdx], markOld && ops[q].oldIdx === lastOld);
        }
      }
      for (let q = k; q <= r; q++) {
        if (ops[q].type === 'insert') {
          pushLine('+', diff.newLines[ops[q].newIdx], markNew && ops[q].newIdx === lastNew);
        }
      }
      k = r + 1;
    }
  }

  return header + lines.join('\n') + '\n';
}

const HUNK_HEADER_RE = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$/;

function stripPatchName(raw, prefix) {
  let name = raw.split('\t')[0];
  if (name === '/dev/null') return null;
  if (name.startsWith(prefix)) name = name.slice(prefix.length);
  return name;
}

function parseUnifiedPatch(text) {
  const warnings = [];
  const files = [];
  try {
    const raw = String(text === undefined || text === null ? '' : text);
    const srcLines = raw.split('\n');
    // A trailing '\n' produces one empty last element; it is not content.
    if (srcLines.length > 0 && srcLines[srcLines.length - 1] === '') srcLines.pop();

    let pendingMeta = [];
    let currentFile = null;
    let i = 0;
    const n = srcLines.length;

    while (i < n) {
      const line = srcLines[i];

      if (line.startsWith('--- ') && i + 1 < n && srcLines[i + 1].startsWith('+++ ')) {
        currentFile = {
          oldName: stripPatchName(line.slice(4), 'a/'),
          newName: stripPatchName(srcLines[i + 1].slice(4), 'b/'),
          meta: pendingMeta,
          hunks: []
        };
        pendingMeta = [];
        files.push(currentFile);
        i += 2;
        continue;
      }

      const m = HUNK_HEADER_RE.exec(line);
      if (!m) {
        pendingMeta.push(line);
        i++;
        continue;
      }

      if (!currentFile) {
        // Bare hunk stream with no ---/+++ headers: synthesize a file.
        currentFile = { oldName: null, newName: null, meta: pendingMeta, hunks: [] };
        pendingMeta = [];
        files.push(currentFile);
      } else if (pendingMeta.length > 0) {
        currentFile.meta.push(...pendingMeta);
        pendingMeta = [];
      }

      const headerLineNo = i + 1;
      const hunk = {
        oldStart: parseInt(m[1], 10),
        oldCount: m[2] === undefined ? 1 : parseInt(m[2], 10),
        newStart: parseInt(m[3], 10),
        newCount: m[4] === undefined ? 1 : parseInt(m[4], 10),
        header: line,
        lines: []
      };
      currentFile.hunks.push(hunk);
      i++;

      let oldSeen = 0;
      let newSeen = 0;
      let ended = false;
      while (i < n && !ended && (oldSeen < hunk.oldCount || newSeen < hunk.newCount)) {
        const l = srcLines[i];
        // Tolerate a fully empty line inside a hunk as an empty context line
        // (some tools strip the trailing space).
        const c = l.length === 0 ? ' ' : l[0];
        if (c === ' ') {
          hunk.lines.push({ type: ' ', text: l.slice(1) });
          oldSeen++;
          newSeen++;
          i++;
        } else if (c === '-') {
          hunk.lines.push({ type: '-', text: l.slice(1) });
          oldSeen++;
          i++;
        } else if (c === '+') {
          hunk.lines.push({ type: '+', text: l.slice(1) });
          newSeen++;
          i++;
        } else if (c === '\\') {
          if (hunk.lines.length > 0) {
            hunk.lines[hunk.lines.length - 1].noNewline = true;
          } else {
            warnings.push('stray "\\ No newline" marker (@ line ' + (i + 1) + ')');
          }
          i++;
        } else {
          warnings.push('unexpected line inside hunk ends it early (@ line ' + (i + 1) + ')');
          ended = true;
        }
      }
      // A trailing no-newline marker lands after the last counted line.
      if (i < n && !ended && srcLines[i].startsWith('\\')) {
        if (hunk.lines.length > 0) hunk.lines[hunk.lines.length - 1].noNewline = true;
        i++;
      }
      if (oldSeen !== hunk.oldCount || newSeen !== hunk.newCount) {
        warnings.push('hunk line counts do not match header (@ line ' + headerLineNo + ')');
      }
    }

    if (pendingMeta.length > 0 && currentFile) {
      currentFile.meta.push(...pendingMeta);
    }

    let totalHunks = 0;
    for (const f of files) totalHunks += f.hunks.length;
    if (totalHunks === 0) {
      return { files: [], warnings, error: 'No hunks found — is this a unified diff?' };
    }
    return { files, warnings, error: null };
  } catch (e) {
    warnings.push('parser error: ' + (e && e.message ? e.message : String(e)));
    return { files: [], warnings, error: 'No hunks found — is this a unified diff?' };
  }
}

if (typeof module !== 'undefined' && module.exports) { module.exports = { generateUnifiedPatch, parseUnifiedPatch }; }

// ──────────── src/js/share.js ────────────
// Shareable-URL payload codec: JSON -> gzip (when available) -> base64url,
// carried in the location hash as `d=<base64url>` or `du=<base64url>`.

function bytesToBase64url(u8) {
  let binary = '';
  const chunkSize = 8192;
  for (let i = 0; i < u8.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, u8.subarray(i, i + chunkSize));
  }
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64urlToBytes(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4 !== 0) b64 += '=';
  const binary = atob(b64);
  const u8 = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    u8[i] = binary.charCodeAt(i);
  }
  return u8;
}

async function encodeSharePayload(obj, opts) {
  const options = opts || {};
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (!options.forceUncompressed && typeof CompressionStream === 'function') {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return 'd=' + bytesToBase64url(new Uint8Array(buf));
  }
  return 'du=' + bytesToBase64url(bytes);
}

async function decodeSharePayload(hashStr) {
  let hash = String(hashStr);
  if (hash.startsWith('#')) hash = hash.slice(1);
  if (hash.startsWith('d=')) {
    if (typeof DecompressionStream !== 'function') {
      throw new Error('This link requires a newer browser');
    }
    const bytes = base64urlToBytes(hash.slice(2));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  if (hash.startsWith('du=')) {
    const bytes = base64urlToBytes(hash.slice(3));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  throw new Error('Unrecognized share link');
}

if (typeof module !== 'undefined' && module.exports) { module.exports = { encodeSharePayload, decodeSharePayload, bytesToBase64url, base64urlToBytes }; }
