function getHljs() {
  if (hljsTestOverride) return hljsTestOverride;
  return (typeof hljs !== 'undefined') ? hljs : (typeof window !== 'undefined' ? window.hljs : null);
}

function extensionOf(name) {
  if (typeof name !== 'string') return null;
  const m = /\.([^.\/\\]+)$/.exec(name);
  return m ? m[1].toLowerCase() : null;
}

function detectLanguage(sample, filenames) {
  const h = getHljs();
  if (!h) return null;
  if (typeof sample !== 'string' || sample.trim() === '') return null;
  for (const name of filenames || []) {
    const ext = extensionOf(name);
    if (ext && HL_EXT_MAP[ext]) return HL_EXT_MAP[ext];
  }
  const result = h.highlightAuto(sample.slice(0, 2000));
  if (result && result.language && result.relevance >= 5) return result.language;
  return null;
}

function highlightToLines(text, lang) {
  const h = getHljs();
  if (!h || !lang || lang === 'plaintext' || !h.getLanguage(lang)) return null;
  let value;
  try {
    value = h.highlight(text, { language: lang, ignoreIllegals: true }).value;
  } catch (e) {
    return null;
  }
  // result.value contains only escaped text, <span ...> and </span>; split it
  // into per-line HTML, closing open spans at each newline and reopening them
  // on the next line so every line is independently balanced.
  const lines = [];
  const stack = [];
  let current = '';
  const re = /(<span[^>]*>)|(<\/span>)|\n/g;
  let last = 0;
  let m;
  while ((m = re.exec(value)) !== null) {
    current += value.slice(last, m.index);
    if (m[1]) {
      stack.push(m[1]);
      current += m[1];
    } else if (m[2]) {
      stack.pop();
      current += m[2];
    } else {
      current += '</span>'.repeat(stack.length);
      lines.push(current);
      current = stack.join('');
    }
    last = re.lastIndex;
  }
  current += value.slice(last);
  lines.push(current);
  return lines;
}

function sliceRangesForNode(nodeStart, nodeLen, ranges) {
  const out = [];
  for (const r of ranges || []) {
    if (!r) continue;
    const start = Math.max(0, r.start - nodeStart);
    const end = Math.min(nodeLen, r.end - nodeStart);
    if (end > start) out.push({ start, end });
  }
  return out;
}

let overlayTemplateEl = null;

function overlayRanges(lineHtml, ranges, cls) {
  if (typeof document === 'undefined') return lineHtml;
  if (!ranges || ranges.length === 0) return lineHtml;
  if (!overlayTemplateEl) overlayTemplateEl = document.createElement('template');
  overlayTemplateEl.innerHTML = lineHtml;
  const root = overlayTemplateEl.content;
  const sorted = ranges
    .filter((r) => r && r.end > r.start)
    .sort((a, b) => a.start - b.start);
  for (const range of sorted) {
    // Collect target text nodes with node-local slices first, then mutate:
    // splitText only touches the node being wrapped, so slices for the other
    // collected nodes stay valid.
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const targets = [];
    let offset = 0;
    let node;
    while ((node = walker.nextNode()) !== null) {
      const len = node.data.length;
      const local = sliceRangesForNode(offset, len, [range]);
      if (local.length > 0) targets.push({ node, slice: local[0] });
      offset += len;
    }
    for (const t of targets) {
      let target = t.node;
      if (t.slice.start > 0) target = target.splitText(t.slice.start);
      const sliceLen = t.slice.end - t.slice.start;
      if (sliceLen < target.data.length) target.splitText(sliceLen);
      const span = document.createElement('span');
      span.className = cls;
      target.parentNode.insertBefore(span, target);
      span.appendChild(target);
    }
  }
  return overlayTemplateEl.innerHTML;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { HL_EXT_MAP, detectLanguage, highlightToLines, overlayRanges, sliceRangesForNode, setHljsForTesting };
}

// ──────────── src/js/comments.js ────────────
// ── Comment stripping for "ignore comment-only changes" ──
// Reuses the vendored highlight.js tokenizer: whatever the highlighter marks
// as a comment span is stripped, so strings containing comment markers are
// never touched and every registered language works without its own table.

let commentsHljsOverride = null;
function setCommentsHljsForTesting(h) { commentsHljsOverride = h; }

function commentsGetHljs() {
  if (commentsHljsOverride) return commentsHljsOverride;
  return (typeof getHljs === 'function') ? getHljs() : null;
}

// hljs escapes exactly these five entities in its HTML output.
function unescapeHljsHtml(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&#x27;/g, "'").replace(/&amp;/g, '&');
}

// Returns one string per line of `text` with all comment text removed, or
// null when hljs or the language is unavailable. Line count mirrors
// splitLines(text).lines (same trailing-eol handling) so callers can index
// the result by oldIdx/newIdx.
function stripComments(text, lang) {
  const h = commentsGetHljs();
  if (!h || !lang || lang === 'plaintext' || !h.getLanguage(lang)) return null;
  if (text === '') return [];
  let value;
  try {
    value = h.highlight(text, { language: lang, ignoreIllegals: true }).value;
  } catch (e) {
    return null;
  }

  const lines = [];
  let current = '';
  const stack = [];        // one entry per open span: true if inside a comment scope
  let commentDepth = 0;    // > 0 → text belongs to a comment (incl. nested doctags)
  let removedHere = false; // a comment was dropped since the last emitted char

  // Collapse the whitespace a dropped mid-line comment leaves behind, so
  // 'x = 1 /* c */ + 2' strips to 'x = 1 + 2', not 'x = 1  + 2'.
  const emit = (chunk) => {
    if (removedHere && /\s$/.test(current)) chunk = chunk.replace(/^\s+/, '');
    if (chunk) removedHere = false;
    current += chunk;
  };

  const re = /(<span[^>]*>)|(<\/span>)|\n/g;
  let last = 0;
  let m;
  while ((m = re.exec(value)) !== null) {
    const textPart = value.slice(last, m.index);
    if (textPart) {
      if (commentDepth > 0) removedHere = true;
      else emit(unescapeHljsHtml(textPart));
    }
    if (m[1]) {
      const isComment = commentDepth > 0 || /\bhljs-comment\b/.test(m[1]);
      stack.push(isComment);
      if (isComment) commentDepth++;
    } else if (m[2]) {
      if (stack.pop()) commentDepth--;
    } else {
      // A comment ending the line takes the whitespace before it along.
      lines.push(removedHere ? current.replace(/\s+$/, '') : current);
      current = '';
      removedHere = false;
    }
    last = re.lastIndex;
  }
  const tail = value.slice(last);
  if (tail && commentDepth === 0) emit(unescapeHljsHtml(tail));
  lines.push(removedHere ? current.replace(/\s+$/, '') : current);
  if (text.endsWith('\n')) lines.pop();
  return lines;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { stripComments, setCommentsHljsForTesting };
}

// ──────────── src/js/json-mode.js ────────────
// ── JSON mode: normalize (sort keys, pretty-print) then reuse the line diff ──

function sortKeysDeep(value) {
  if (Array.isArray(value)) return value.map(sortKeysDeep); // array order is semantic — keep it
  if (value !== null && typeof value === 'object') {
    const out = {};
    for (const key of Object.keys(value).sort()) out[key] = sortKeysDeep(value[key]);
    return out;
  }
  return value;
}

// Returns { ok: true, normalized } or { ok: false, error }
function normalizeJsonInput(text) {
  if (text.trim() === '') return { ok: true, normalized: '' };
  try {
    const parsed = JSON.parse(text);
    return { ok: true, normalized: JSON.stringify(sortKeysDeep(parsed), null, 2) + '\n' };
  } catch (e) {
    return { ok: false, error: jsonErrorMessage(e, text) };
  }
}

function jsonErrorMessage(e, text) {
  let msg = String(e && e.message || 'Invalid JSON');
  // Add a line/column hint when the engine reports a character position.
  const m = msg.match(/position (\d+)/);
  if (m) {
    const pos = Number(m[1]);
    const before = text.slice(0, pos);
    const line = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    if (!/line \d+/.test(msg)) msg += ' (line ' + line + ', column ' + col + ')';
  }
  return msg;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { sortKeysDeep, normalizeJsonInput, jsonErrorMessage };
}

// ──────────── src/js/render.js ────────────
// ── Renderers: build HTML strings for unified/split/patch views ──
// Pure string builders (aside from renderLineContent's optional overlayRanges
// call, which touches DOM via a detached template element). Callers assign
// the result to diffScroll.innerHTML, or embed it in an exported report.

function groupOps(ops) {
  const groups = [];
  let current = null;
  for (const op of ops) {
    const gtype = op.type === 'equal' ? 'equal' : 'change';
    if (!current || current.type !== gtype) {
      current = { type: gtype, ops: [] };
      groups.push(current);
    }
    current.ops.push(op);
  }
  return groups;
}

function diffStatCounts(ops) {
  let added = 0, removed = 0, unchanged = 0, moved = 0;
  for (const op of ops) {
    // Moved pairs count once (on the insert side) and never as added/removed.
    if (op.type === 'insert') { if (op.moveId != null) moved++; else added++; }
    else if (op.type === 'delete') { if (op.moveId == null) removed++; }
    else unchanged++;
  }
  return { added, removed, unchanged, moved };
}

function moveRowAttrs(op) {
  if (op.moveId == null) return '';
  const out = op.type === 'delete';
  return ' data-move-id="' + op.moveId + '"' +
    ' data-move-row="' + (out ? 'o' + op.oldIdx : 'n' + op.newIdx) + '"' +
    ' data-move-partner="' + (out ? 'n' + op.moveTo : 'o' + op.moveFrom) + '"' +
    ' title="' + (out ? 'Moved to line ' + (op.moveTo + 1) : 'Moved from line ' + (op.moveFrom + 1)) + '"';
}

// Compose a line's cell HTML from raw text, optional pre-highlighted HTML,
// and inline diff ranges (offsets into the raw text).
function renderLineContent(text, hlHtml, ranges, cls) {
  if (!ranges || ranges.length === 0) return hlHtml != null ? hlHtml : esc(text);
  if (hlHtml != null && typeof overlayRanges === 'function') {
    return overlayRanges(hlHtml, ranges, cls);
  }
  let html = '';
  let pos = 0;
  for (const r of ranges) {
    if (r.start > pos) html += esc(text.slice(pos, r.start));
    html += '<span class="' + cls + '">' + esc(text.slice(r.start, r.end)) + '</span>';
    pos = r.end;
  }
  if (pos < text.length) html += esc(text.slice(pos));
  return html;
}

// Pair non-moved deletes with non-moved inserts positionally for inline
// char/word highlights. Returns op -> ranges (oldRanges for deletes,
// newRanges for inserts); moved ops get no entry.
function buildPairRanges(deletes, inserts, oldLines, newLines, granularity) {
  const pairDeletes = deletes.filter(o => o.moveId == null);
  const pairInserts = inserts.filter(o => o.moveId == null);
  const pairCount = Math.min(pairDeletes.length, pairInserts.length);
  const rangesByOp = new Map();
  for (let i = 0; i < pairCount; i++) {
    const r = inlineDiffRanges(
      oldLines[pairDeletes[i].oldIdx], newLines[pairInserts[i].newIdx], granularity);
    rangesByOp.set(pairDeletes[i], r.oldRanges);
    rangesByOp.set(pairInserts[i], r.newRanges);
  }
  return rangesByOp;
}

function collapsePlan(groupLen, isFirst, isLast, contextLines) {
  const headKeep = isFirst ? 0 : contextLines;
  const tailKeep = isLast ? 0 : contextLines;
  const hiddenCount = groupLen - headKeep - tailKeep;
  if (hiddenCount < 3) return null;
  return { headKeep, tailKeep, hiddenCount };
}

function expanderRowHtml(collapseId, hiddenCount, colspan) {
  return '<tr class="diff-row-collapse" data-collapse-id="' + collapseId + '">' +
    '<td colspan="' + colspan + '">&#8943; Show ' + hiddenCount + ' hidden line' +
    (hiddenCount === 1 ? '' : 's') + ' &#8943;</td></tr>';
}

// opts: { collapse, contextLines, granularity, hlOld, hlNew }
function buildUnifiedHtml(diff, opts) {
  const { oldLines, newLines } = diff;
  const groups = groupOps(diff.ops);
  const hasChanges = diff.ops.some(op => op.type !== 'equal');
  const doCollapse = !!opts.collapse && hasChanges;
  let html = '<table class="diff-table">';
  let changeGroupIdx = 0;
  let collapseId = 0;

  for (let g = 0; g < groups.length; g++) {
    const group = groups[g];
    if (group.type === 'equal') {
      const plan = doCollapse
        ? collapsePlan(group.ops.length, g === 0, g === groups.length - 1, opts.contextLines)
        : null;
      for (let i = 0; i < group.ops.length; i++) {
        const op = group.ops[i];
        const hidden = plan && i >= plan.headKeep && i < group.ops.length - plan.tailKeep;
        if (hidden && i === plan.headKeep) html += expanderRowHtml(collapseId, plan.hiddenCount, 4);
        // Equal ops from whitespace-only line joins/splits may carry only one
        // side; show whichever side exists and leave the other number blank.
        const content = op.oldIdx != null
          ? ((opts.hlOld && opts.hlOld[op.oldIdx] != null) ? opts.hlOld[op.oldIdx] : esc(oldLines[op.oldIdx]))
          : ((opts.hlNew && opts.hlNew[op.newIdx] != null) ? opts.hlNew[op.newIdx] : esc(newLines[op.newIdx]));
        html += '<tr class="diff-row-unchanged' + (hidden ? ' collapse-hidden' : '') + '"' +
          (hidden ? ' data-collapse-id="' + collapseId + '"' : '') + '>' +
          '<td class="line-num">' + (op.oldIdx != null ? op.oldIdx + 1 : '') + '</td>' +
          '<td class="line-num">' + (op.newIdx != null ? op.newIdx + 1 : '') + '</td>' +
          '<td class="line-type"></td>' +
          '<td class="line-content">' + content + '</td></tr>';
      }
      if (plan) collapseId++;
    } else {
      const deletes = group.ops.filter(o => o.type === 'delete');
      const inserts = group.ops.filter(o => o.type === 'insert');
      // Moved lines are excluded from positional inline pairing — a moved
      // line's real partner is elsewhere, not the line across from it.
      const rangesByOp = buildPairRanges(deletes, inserts, oldLines, newLines, opts.granularity);
      const gAttr = ' data-change-group="' + changeGroupIdx + '"';
      let first = true;

      for (let i = 0; i < deletes.length; i++) {
        const op = deletes[i];
        const text = oldLines[op.oldIdx];
        const hl = opts.hlOld ? opts.hlOld[op.oldIdx] : null;
        const ranges = rangesByOp.get(op) || [];
        const isMove = op.moveId != null;
        html += '<tr class="' + (isMove ? 'diff-row-moved-out' : 'diff-row-removed') + '"' +
          gAttr + moveRowAttrs(op) + (first ? ' data-change-first' : '') + '>' +
          '<td class="line-num">' + (op.oldIdx + 1) + '</td>' +
          '<td class="line-num"></td>' +
          '<td class="line-type">' + (isMove ? '&#8645;' : '-') + '</td>' +
          '<td class="line-content">' + renderLineContent(text, hl, ranges, 'char-highlight-remove') + '</td></tr>';
        first = false;
      }

      for (let i = 0; i < inserts.length; i++) {
        const op = inserts[i];
        const text = newLines[op.newIdx];
        const hl = opts.hlNew ? opts.hlNew[op.newIdx] : null;
        const ranges = rangesByOp.get(op) || [];
        const isMove = op.moveId != null;
        html += '<tr class="' + (isMove ? 'diff-row-moved-in' : 'diff-row-added') + '"' +
          gAttr + moveRowAttrs(op) + (first ? ' data-change-first' : '') + '>' +
          '<td class="line-num"></td>' +
          '<td class="line-num">' + (op.newIdx + 1) + '</td>' +
          '<td class="line-type">' + (isMove ? '&#8645;' : '+') + '</td>' +
          '<td class="line-content">' + renderLineContent(text, hl, ranges, 'char-highlight-add') + '</td></tr>';
        first = false;
      }
      changeGroupIdx++;
    }
  }

  html += '</table>';
  return html;
}

// opts: same as buildUnifiedHtml, plus { oldLabel, newLabel }
function buildSplitHtml(diff, opts) {
  const { oldLines, newLines } = diff;
  const groups = groupOps(diff.ops);
  const hasChanges = diff.ops.some(op => op.type !== 'equal');
  const doCollapse = !!opts.collapse && hasChanges;
  let changeGroupIdx = 0;
  let collapseId = 0;

  let leftHtml = '<table class="diff-table">';
  let rightHtml = '<table class="diff-table">';

  for (let g = 0; g < groups.length; g++) {
    const group = groups[g];
    if (group.type === 'equal') {
      const plan = doCollapse
        ? collapsePlan(group.ops.length, g === 0, g === groups.length - 1, opts.contextLines)
        : null;
      for (let i = 0; i < group.ops.length; i++) {
        const op = group.ops[i];
        const hidden = plan && i >= plan.headKeep && i < group.ops.length - plan.tailKeep;
        if (hidden && i === plan.headKeep) {
          leftHtml += expanderRowHtml(collapseId, plan.hiddenCount, 2);
          rightHtml += expanderRowHtml(collapseId, plan.hiddenCount, 2);
        }
        const rowCls = 'diff-row-unchanged' + (hidden ? ' collapse-hidden' : '');
        const idAttr = hidden ? ' data-collapse-id="' + collapseId + '"' : '';
        // Equal ops from whitespace-only line joins/splits may carry only one
        // side; pad the other side so the columns stay aligned.
        if (op.oldIdx != null) {
          const oldContent = (opts.hlOld && opts.hlOld[op.oldIdx] != null)
            ? opts.hlOld[op.oldIdx] : esc(oldLines[op.oldIdx]);
          leftHtml += '<tr class="' + rowCls + '"' + idAttr + '><td class="line-num">' + (op.oldIdx + 1) +
            '</td><td class="line-content">' + oldContent + '</td></tr>';
        } else {
          leftHtml += '<tr class="' + rowCls + '"' + idAttr + '><td class="line-num"></td><td class="line-content"></td></tr>';
        }
        if (op.newIdx != null) {
          const newContent = (opts.hlNew && opts.hlNew[op.newIdx] != null)
            ? opts.hlNew[op.newIdx] : esc(newLines[op.newIdx]);
          rightHtml += '<tr class="' + rowCls + '"' + idAttr + '><td class="line-num">' + (op.newIdx + 1) +
            '</td><td class="line-content">' + newContent + '</td></tr>';
        } else {
          rightHtml += '<tr class="' + rowCls + '"' + idAttr + '><td class="line-num"></td><td class="line-content"></td></tr>';
        }
      }
      if (plan) collapseId++;
    } else {
      const deletes = group.ops.filter(o => o.type === 'delete');
      const inserts = group.ops.filter(o => o.type === 'insert');
      const maxLen = Math.max(deletes.length, inserts.length);
      const rangesByOp = buildPairRanges(deletes, inserts, oldLines, newLines, opts.granularity);
      const gAttr = ' data-change-group="' + changeGroupIdx + '"';

      for (let i = 0; i < maxLen; i++) {
        const isFirst = i === 0;
        if (i < deletes.length) {
          const op = deletes[i];
          const ranges = rangesByOp.get(op) || [];
          const hl = opts.hlOld ? opts.hlOld[op.oldIdx] : null;
          const cls = op.moveId != null ? 'diff-row-moved-out' : 'diff-row-removed';
          leftHtml += '<tr class="' + cls + '"' + gAttr + moveRowAttrs(op) +
            (isFirst ? ' data-change-first' : '') +
            '><td class="line-num">' + (op.oldIdx + 1) + '</td><td class="line-content">' +
            renderLineContent(oldLines[op.oldIdx], hl, ranges, 'char-highlight-remove') + '</td></tr>';
        } else {
          leftHtml += '<tr class="diff-row-unchanged"><td class="line-num"></td><td class="line-content"></td></tr>';
        }

        if (i < inserts.length) {
          const op = inserts[i];
          const ranges = rangesByOp.get(op) || [];
          const hl = opts.hlNew ? opts.hlNew[op.newIdx] : null;
          const cls = op.moveId != null ? 'diff-row-moved-in' : 'diff-row-added';
          rightHtml += '<tr class="' + cls + '"' + gAttr + moveRowAttrs(op) +
            '><td class="line-num">' + (op.newIdx + 1) +
            '</td><td class="line-content">' +
            renderLineContent(newLines[op.newIdx], hl, ranges, 'char-highlight-add') + '</td></tr>';
        } else {
          rightHtml += '<tr class="diff-row-unchanged"><td class="line-num"></td><td class="line-content"></td></tr>';
        }
      }
      changeGroupIdx++;
    }
  }

  leftHtml += '</table>';
  rightHtml += '</table>';

  return '<div class="diff-side-wrapper">' +
    '<div class="diff-side"><div class="diff-side-header">' + esc(opts.oldLabel || 'Original') + '</div>' + leftHtml + '</div>' +
    '<div class="diff-side"><div class="diff-side-header">' + esc(opts.newLabel || 'Modified') + '</div>' + rightHtml + '</div>' +
    '</div>';
}

// ── Patch view: render a parsed unified patch ──
function buildPatchViewHtml(parsed) {
  let html = '<table class="diff-table">';
  let changeGroupIdx = 0;

  for (const file of parsed.files) {
    if (file.oldName != null || file.newName != null) {
      const label = (file.oldName === file.newName || file.newName == null)
        ? (file.oldName || file.newName)
        : (file.oldName == null ? file.newName : file.oldName + ' → ' + file.newName);
      html += '<tr class="diff-row-file"><td colspan="4">' + esc(label || '') + '</td></tr>';
    }
    for (const meta of file.meta) {
      if (meta.trim() === '') continue;
      html += '<tr class="diff-row-meta"><td colspan="4">' + esc(meta) + '</td></tr>';
    }
    for (const hunk of file.hunks) {
      html += '<tr class="diff-row-separator"><td colspan="4">' + esc(hunk.header) + '</td></tr>';
      let oldNum = hunk.oldStart;
      let newNum = hunk.newStart;
      let inRun = false;
      for (const line of hunk.lines) {
        const isChange = line.type !== ' ';
        const firstAttr = isChange && !inRun
          ? ' data-change-group="' + (changeGroupIdx++) + '" data-change-first' : '';
        inRun = isChange;
        let cls, oldCell = '', newCell = '', typeCell = '';
        if (line.type === '-') {
          cls = 'diff-row-removed'; oldCell = oldNum++; typeCell = '-';
        } else if (line.type === '+') {
          cls = 'diff-row-added'; newCell = newNum++; typeCell = '+';
        } else {
          cls = 'diff-row-unchanged'; oldCell = oldNum++; newCell = newNum++;
        }
        html += '<tr class="' + cls + '"' + firstAttr + '>' +
          '<td class="line-num">' + oldCell + '</td>' +
          '<td class="line-num">' + newCell + '</td>' +
          '<td class="line-type">' + typeCell + '</td>' +
          '<td class="line-content">' + esc(line.text) +
          (line.noNewline ? '<span class="no-newline-marker" title="No newline at end of file">&#9083;</span>' : '') +
          '</td></tr>';
      }
    }
  }

  html += '</table>';
  return html;
}

function emptyStateHtml(msg) {
  return '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg><p>' + msg + '</p></div>';
}

// ──────────── src/js/files.js ────────────
// ── File loading: per-pane pickers + drag & drop ──

const FILE_HARD_LIMIT = 10 * 1024 * 1024;  // reject
const FILE_WARN_LIMIT = 1 * 1024 * 1024;   // confirm

function setupFileHandling() {
  document.querySelectorAll('.pane-open').forEach(btn => {
    const side = btn.dataset.side;
    const input = document.getElementById(side + 'FileInput');
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', () => {
      if (input.files && input.files[0]) loadFileIntoPane(input.files[0], side);
      input.value = '';
    });
  });

  document.querySelectorAll('.input-pane').forEach(pane => {
    const side = pane.dataset.side;
    if (!side) return;
    let dragDepth = 0;
    pane.addEventListener('dragover', (e) => { e.preventDefault(); });
    pane.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragDepth++;
      pane.classList.add('drop-target');
    });
    pane.addEventListener('dragleave', () => {
      dragDepth--;
      if (dragDepth <= 0) { dragDepth = 0; pane.classList.remove('drop-target'); }
    });
    pane.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      pane.classList.remove('drop-target');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) loadFileIntoPane(file, side);
    });
  });

  document.querySelectorAll('.file-clear').forEach(btn => {
    btn.addEventListener('click', () => {
      setPaneFilename(btn.closest('.pane-header').dataset.side || btn.dataset.side, null);
    });
  });
}

async function loadFileIntoPane(file, side) {
  if (file.size > FILE_HARD_LIMIT) {
    showToast('File too large (' + formatBytes(file.size) + ') — limit is 10 MB');
    return;
  }
  if (file.size > FILE_WARN_LIMIT &&
      !confirm(file.name + ' is ' + formatBytes(file.size) + '. Large files may be slow. Load anyway?')) {
    return;
  }
  let text;
  try {
    text = await file.text();
  } catch (e) {
    showToast('Could not read ' + file.name);
    return;
  }
  if (text.slice(0, 8192).includes('\u0000') &&
      !confirm(file.name + ' looks like a binary file. Load anyway?')) {
    return;
  }
  const input = side === 'left' ? leftInput : rightInput;
  input.value = text;
  setPaneFilename(side, file.name);
  // One code path for char counts, auto-save, and auto-compare.
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

function setPaneFilename(side, name) {
  if (side === 'left') session.leftName = name;
  else session.rightName = name;
  const chip = document.getElementById(side + 'File');
  if (name) {
    chip.querySelector('.pane-file-name').textContent = name;
    chip.hidden = false;
  } else {
    chip.hidden = true;
  }
  saveInputs();
}

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  toastArea.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function showNotice(html, kind) {
  const el = document.createElement('div');
  el.className = 'notice' + (kind === 'error' ? ' notice-error' : '');
  el.innerHTML = html + '<button class="notice-close" title="Dismiss">&times;</button>';
  el.querySelector('.notice-close').addEventListener('click', () => el.remove());
  noticeArea.appendChild(el);
}

function clearNotices() {
  noticeArea.innerHTML = '';
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to legacy path */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) {
    return false;
  }
}

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function patchFileNames() {
  return {
    oldName: session.leftName || 'original',
    newName: session.rightName || 'modified',
  };
}

function currentPatchText() {
  if (!session.lastDiff) return null;
  const names = patchFileNames();
  return generateUnifiedPatch(session.lastDiff, {
    context: settings.contextLines,
    oldName: names.oldName,
    newName: names.newName,
  });
}

async function exportCopyPatch() {
  const patch = currentPatchText();
  if (patch == null) return;
  showToast((await copyText(patch)) ? 'Patch copied to clipboard' : 'Copy failed');
}

function exportDownloadPatch() {
  const patch = currentPatchText();
  if (patch == null) return;
  const names = patchFileNames();
  const base = (names.oldName + '-vs-' + names.newName).replace(/[^\w.-]+/g, '_');
  downloadFile(base + '.patch', patch, 'text/x-patch');
}

function exportHtmlReport() {
  if (!session.lastDiff) return;
  const diff = session.lastDiff;
  const names = patchFileNames();
  const stats = diffStatCounts(diff.ops);
  const body = buildUnifiedHtml(diff, {
    collapse: false,
    contextLines: settings.contextLines,
    granularity: settings.granularity,
    hlOld: session.hlOld,
    hlNew: session.hlNew,
  });
  const now = new Date();
  const html = '<!DOCTYPE html>\n<html lang="en"><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<title>Diff: ' + esc(names.oldName) + ' vs ' + esc(names.newName) + '</title>' +
    '<style>' + REPORT_CSS + '</style></head><body>' +
    '<div class="report-header">' +
    '<h1>' + esc(names.oldName) + ' &#8594; ' + esc(names.newName) + '</h1>' +
    '<p class="report-meta">Generated ' + esc(now.toLocaleString()) +
    ' &middot; <span class="stat-added">+' + stats.added + '</span>' +
    ' <span class="stat-removed">-' + stats.removed + '</span>' +
    (stats.moved ? ' <span class="stat-moved">&#8645;' + stats.moved + '</span>' : '') +
    ' &middot; ' + stats.unchanged + ' unchanged</p></div>' +
    '<div class="report-diff">' + body + '</div>' +
    '</body></html>';
  downloadFile('diff-report.html', html, 'text/html');
}

const SHARE_WARN_BYTES = 8 * 1024;
const SHARE_MAX_BYTES = 100 * 1024;

async function exportShareLink() {
  const payload = {
    v: 1,
    l: leftInput.value,
    r: rightInput.value,
    ln: session.leftName,
    rn: session.rightName,
    s: {
      mode: settings.mode,
      view: settings.view,
      granularity: settings.granularity,
      ignoreWhitespace: settings.ignoreWhitespace,
      ignoreCase: settings.ignoreCase,
      language: settings.language,
      detectMoves: settings.detectMoves,
      ignoreComments: settings.ignoreComments,
    },
  };
  let hash;
  try {
    hash = await encodeSharePayload(payload);
  } catch (e) {
    showToast('Could not create share link');
    return;
  }
  if (hash.length > SHARE_MAX_BYTES) {
    showToast('Inputs are too large to share via URL (' + formatBytes(hash.length) + ')');
    return;
  }
  const url = location.href.split('#')[0] + '#' + hash;
  const ok = await copyText(url);
  if (!ok) { showToast('Copy failed'); return; }
  let msg = 'Link copied (' + formatBytes(url.length) + ')';
  if (hash.length > SHARE_WARN_BYTES) msg += ' — very long URLs may not paste everywhere';
  showToast(msg);
}

function jumpDiff(dir) {
  if (session.changeGroups.length === 0) return;
  session.currentChangeIdx += dir;
  if (session.currentChangeIdx < 0) session.currentChangeIdx = session.changeGroups.length - 1;
  if (session.currentChangeIdx >= session.changeGroups.length) session.currentChangeIdx = 0;
  updateNavLabel();
  const el = session.changeGroups[session.currentChangeIdx];
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  flashRow(el);
}

function updateNavLabel() {
  if (session.changeGroups.length === 0) {
    diffNavLabel.textContent = '';
  } else {
    diffNavLabel.textContent = (session.currentChangeIdx + 1) + '/' + session.changeGroups.length;
  }
}

function refreshChangeGroups() {
  session.changeGroups = Array.from(diffScroll.querySelectorAll('[data-change-first]'));
  session.currentChangeIdx = -1;
  updateNavLabel();
}

// ── Minimap ──
function updateMinimap() {
  diffMinimap.querySelectorAll('.minimap-marker').forEach(m => m.remove());

  const totalHeight = diffScroll.scrollHeight;
  if (totalHeight === 0) return;
  const mapHeight = diffMinimap.clientHeight;

  const rows = diffScroll.querySelectorAll(
    '.diff-row-added, .diff-row-removed, .diff-row-moved-in, .diff-row-moved-out');
  rows.forEach(row => {
    const height = row.offsetHeight;
    if (height === 0) return; // collapsed rows
    const top = row.offsetTop;
    const marker = document.createElement('div');
    marker.className = 'minimap-marker ' + (row.classList.contains('diff-row-added') ? 'added'
      : row.classList.contains('diff-row-removed') ? 'removed' : 'moved');
    marker.style.top = ((top / totalHeight) * mapHeight) + 'px';
    marker.style.height = Math.max(2, (height / totalHeight) * mapHeight) + 'px';
    diffMinimap.appendChild(marker);
  });

  updateMinimapViewport();
}

function updateMinimapViewport() {
  const totalHeight = diffScroll.scrollHeight;
  const mapHeight = diffMinimap.clientHeight;
  if (totalHeight === 0) { minimapViewport.style.display = 'none'; return; }
  minimapViewport.style.display = '';
  minimapViewport.style.top = ((diffScroll.scrollTop / totalHeight) * mapHeight) + 'px';
  minimapViewport.style.height = ((diffScroll.clientHeight / totalHeight) * mapHeight) + 'px';
}

function setupUiExtras() {
  diffScroll.addEventListener('scroll', updateMinimapViewport);

  diffMinimap.addEventListener('click', (e) => {
    const rect = diffMinimap.getBoundingClientRect();
    const ratio = (e.clientY - rect.top) / rect.height;
    diffScroll.scrollTop = ratio * diffScroll.scrollHeight - diffScroll.clientHeight / 2;
  });

  window.addEventListener('resize', () => {
    if (session.lastDiff || session.lastPatch) requestAnimationFrame(updateMinimap);
  });

  // ── Resize handle ──
  let isResizing = false;
  resizeHandle.addEventListener('mousedown', (e) => {
    isResizing = true;
    resizeHandle.classList.add('dragging');
    document.body.style.cursor = 'row-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const mainContent = document.getElementById('mainContent');
    const rect = mainContent.getBoundingClientRect();
    const offset = e.clientY - rect.top;
    const newH = Math.max(80, Math.min(rect.height - 150, offset));
    inputArea.style.height = newH + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!isResizing) return;
    isResizing = false;
    resizeHandle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // ── Change navigation ──
  prevDiffBtn.addEventListener('click', () => jumpDiff(-1));
  nextDiffBtn.addEventListener('click', () => jumpDiff(1));

  document.addEventListener('keydown', (e) => {
    if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); jumpDiff(-1); }
    if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); jumpDiff(1); }
  });

  // ── Input textarea scroll sync ──
  let isSyncingScroll = false;
  function mirrorScroll(from, to) {
    if (!settings.syncInputScroll || isSyncingScroll) return;
    isSyncingScroll = true;
    to.scrollTop = from.scrollTop;
    to.scrollLeft = from.scrollLeft;
    requestAnimationFrame(() => { isSyncingScroll = false; });
  }
  leftInput.addEventListener('scroll', () => mirrorScroll(leftInput, rightInput));
  rightInput.addEventListener('scroll', () => mirrorScroll(rightInput, leftInput));
}

// ──────────── src/js/main.js ────────────
// ── App orchestration and event wiring ──

const HL_MAX_CHARS = 500 * 1024;
const HL_MAX_LINES = 20000;
const AUTO_COMPARE_LIMIT = 300 * 1024;

let autoCompareTimer = null;
let saveInputsTimer = null;
let autoCompareWarned = false;

function countLines(t) {
  let n = 1;
  for (let p = t.indexOf('\n'); p !== -1; p = t.indexOf('\n', p + 1)) n++;
  return n;
}

function updateCounts() {
  leftCount.textContent = leftInput.value.length + ' chars';
  rightCount.textContent = rightInput.value.length + ' chars';
}

function refreshFileChips() {
  setPaneFilename('left', session.leftName);
  setPaneFilename('right', session.rightName);
}

function showDiffArea() {
  inputArea.classList.add('has-diff');
  resizeHandle.style.display = '';
  diffArea.classList.add('visible');
}

function hideDiffArea() {
  diffArea.classList.remove('visible');
  resizeHandle.style.display = 'none';
  inputArea.classList.remove('has-diff');
  inputArea.style.height = '';
}

// ── Language resolution (shared by highlighting and comment stripping) ──
function resolveLanguage(aText, bText) {
  if (settings.mode === 'json') return 'json';
  if (settings.language === 'plain') return null;
  if (settings.language === 'auto') {
    const sample = aText.length >= bText.length ? aText : bText;
    return typeof detectLanguage === 'function'
      ? detectLanguage(sample, [session.leftName, session.rightName]) : null;
  }
  return settings.language;
}

// ── Syntax highlighting prep ──
function prepareHighlight(aText, bText, diff, lang) {
  session.hlOld = null;
  session.hlNew = null;
  session.activeLang = null;
  if (typeof highlightToLines !== 'function') { updateLangChip(); return; }

  if (!lang || lang === 'plaintext') { updateLangChip(); return; }
  if (aText.length > HL_MAX_CHARS || bText.length > HL_MAX_CHARS ||
      diff.oldLines.length > HL_MAX_LINES || diff.newLines.length > HL_MAX_LINES) {
    updateLangChip();
    return;
  }
  session.hlOld = highlightToLines(diff.oldLines.join('\n'), lang);
  session.hlNew = highlightToLines(diff.newLines.join('\n'), lang);
  session.activeLang = (session.hlOld || session.hlNew) ? lang : null;
  updateLangChip();
}

function updateLangChip() {
  if (session.activeLang) {
    langChip.textContent = session.activeLang;
    langChip.hidden = false;
  } else {
    langChip.hidden = true;
  }
}

// ── Compare / render ──
function runDiff() {
  clearNotices();

  if (settings.mode === 'patch') {
    session.lastDiff = null;
    session.lastPatch = null;
    session.activeLang = null;
    updateLangChip();
    const parsed = parseUnifiedPatch(leftInput.value);
    showDiffArea();
    if (parsed.error) {
      diffStats.innerHTML = '';
      diffScroll.innerHTML = emptyStateHtml(parsed.error);
      refreshChangeGroups();
      requestAnimationFrame(updateMinimap);
      return;
    }
    for (const w of parsed.warnings) showNotice(esc(w));
    session.lastPatch = parsed;
    renderCurrentPatch();
    return;
  }

  let a = leftInput.value;
  let b = rightInput.value;
  if (settings.mode === 'json') {
    const ra = normalizeJsonInput(a);
    const rb = normalizeJsonInput(b);
    let bad = false;
    if (!ra.ok) { showNotice('<strong>Original:</strong> ' + esc(ra.error), 'error'); bad = true; }
    if (!rb.ok) { showNotice('<strong>Modified:</strong> ' + esc(rb.error), 'error'); bad = true; }
    if (bad) return;
    a = ra.normalized;
    b = rb.normalized;
  }

  const lang = resolveLanguage(a, b);
  let aSrc = null;
  let bSrc = null;
  if (settings.ignoreComments) {
    if (!lang || lang === 'plaintext' || typeof stripComments !== 'function') {
      showNotice('Ignore comments has no effect &mdash; no language detected. Pick one under Language in options.');
    } else if (a.length > HL_MAX_CHARS || b.length > HL_MAX_CHARS ||
               countLines(a) > HL_MAX_LINES || countLines(b) > HL_MAX_LINES) {
      showNotice('Ignore comments skipped &mdash; input is too large for language analysis.');
    } else {
      aSrc = stripComments(a, lang);
      bSrc = stripComments(b, lang);
      if (!aSrc || !bSrc) {
        aSrc = bSrc = null;
        showNotice('Ignore comments has no effect for this language.');
      }
    }
  }

  const diff = computeDiff(a, b, {
    ignoreWhitespace: settings.ignoreWhitespace,
    ignoreCase: settings.ignoreCase,
    detectMoves: settings.detectMoves,
    aKeySource: aSrc,
    bKeySource: bSrc,
  });
  session.lastDiff = diff;
  session.lastPatch = null;
  if (diff.truncated) {
    showNotice('Diff too complex &mdash; showing a block replacement for the changed middle section.');
  }
  prepareHighlight(a, b, diff, lang);
  showDiffArea();
  renderCurrentDiff();
}

function renderCurrentDiff() {
  const diff = session.lastDiff;
  if (!diff) { if (session.lastPatch) renderCurrentPatch(); return; }

  const stats = diffStatCounts(diff.ops);
  diffStats.innerHTML =
    '<span class="stat-added">+' + stats.added + ' added</span>' +
    '<span class="stat-removed">-' + stats.removed + ' removed</span>' +
    (stats.moved ? '<span class="stat-moved">&#8645;' + stats.moved + ' moved</span>' : '') +
    '<span class="stat-unchanged">' + stats.unchanged + ' unchanged</span>';

  const opts = {
    collapse: settings.collapseUnchanged,
    contextLines: settings.contextLines,
    granularity: settings.granularity,
    hlOld: session.hlOld,
    hlNew: session.hlNew,
    oldLabel: session.leftName || 'Original',
    newLabel: session.rightName || 'Modified',
  };
  const isEmpty = diff.oldLines.length === 0 && diff.newLines.length === 0;
  diffScroll.innerHTML = isEmpty
    ? emptyStateHtml('Both inputs are empty')
    : (settings.view === 'split' ? buildSplitHtml(diff, opts) : buildUnifiedHtml(diff, opts));
  refreshChangeGroups();
  requestAnimationFrame(updateMinimap);
}

function renderCurrentPatch() {
  const parsed = session.lastPatch;
  if (!parsed) return;
  let added = 0, removed = 0;
  for (const file of parsed.files) {
    for (const hunk of file.hunks) {
      for (const line of hunk.lines) {
        if (line.type === '+') added++;
        else if (line.type === '-') removed++;
      }
    }
  }
  diffStats.innerHTML =
    '<span class="stat-added">+' + added + ' added</span>' +
    '<span class="stat-removed">-' + removed + ' removed</span>' +
    '<span class="stat-unchanged">' + parsed.files.length + ' file' + (parsed.files.length === 1 ? '' : 's') + '</span>';
  diffScroll.innerHTML = buildPatchViewHtml(parsed);
  refreshChangeGroups();
  requestAnimationFrame(updateMinimap);
}

// ── Mode / view UI ──
function applyModeUI() {
  modeToggle.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === settings.mode));
  const isPatch = settings.mode === 'patch';
  document.querySelector('.app').classList.toggle('patch-mode', isPatch);
  viewToggle.style.display = isPatch ? 'none' : '';
  diffBtn.textContent = isPatch ? 'Render' : 'Compare';
  leftPaneLabel.textContent = isPatch ? 'Unified diff / patch'
    : (settings.mode === 'json' ? 'Original JSON' : 'Original');
  document.getElementById('rightPaneLabel').textContent =
    settings.mode === 'json' ? 'Modified JSON' : 'Modified';
  leftInput.placeholder = isPatch ? 'Paste a unified diff / git diff output here...'
    : 'Paste original text here...';
}

function applySettingsToControls() {
  viewToggle.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === settings.view));
  settingsPopover.querySelectorAll('[data-gran]').forEach(b =>
    b.classList.toggle('active', b.dataset.gran === settings.granularity));
  document.getElementById('optWhitespace').value = settings.ignoreWhitespace;
  document.getElementById('optIgnoreCase').checked = settings.ignoreCase;
  document.getElementById('optDetectMoves').checked = settings.detectMoves;
  document.getElementById('optIgnoreComments').checked = settings.ignoreComments;
  document.getElementById('optAutoCompare').checked = settings.autoCompare;
  document.getElementById('optCollapse').checked = settings.collapseUnchanged;
  document.getElementById('optSyncScroll').checked = settings.syncInputScroll;
  document.getElementById('optContext').value = settings.contextLines;
  if (langSelect.options.length > 0) {
    langSelect.value = settings.language;
    if (langSelect.selectedIndex === -1) { langSelect.value = 'auto'; settings.language = 'auto'; }
  }
}

function populateLanguageSelect() {
  const h = (typeof hljs !== 'undefined') ? hljs : null;
  if (!h) { document.getElementById('langRow').style.display = 'none'; return; }
  const frag = document.createDocumentFragment();
  const mkOpt = (value, label) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = label;
    return o;
  };
  frag.appendChild(mkOpt('auto', 'Auto-detect'));
  frag.appendChild(mkOpt('plain', 'Plain text'));
  for (const id of h.listLanguages().slice().sort()) frag.appendChild(mkOpt(id, id));
  langSelect.appendChild(frag);
}

function afterComputeSettingChange() {
  saveSettings();
  if (diffArea.classList.contains('visible')) runDiff();
}

function afterRenderSettingChange() {
  saveSettings();
  renderCurrentDiff();
}

// ── Inline options bar vs gear popover ──
const wideOptionsQuery = window.matchMedia('(min-width: 1100px)');

function isInlineOptions() {
  return wideOptionsQuery.matches;
}

function syncOptionsBar() {
  const inline = isInlineOptions();
  settingsPopover.classList.toggle('inline', inline);
  settingsBtn.style.display = inline ? 'none' : '';
  settingsPopover.hidden = !inline;
}

// ── Event wiring ──
function setupMainEvents() {
  for (const input of [leftInput, rightInput]) {
    input.addEventListener('input', () => {
      session.suppressInputSave = false;
      updateCounts();
      clearTimeout(saveInputsTimer);
      saveInputsTimer = setTimeout(saveInputs, 500);
      if (settings.autoCompare) {
        const total = leftInput.value.length + rightInput.value.length;
        if (total > AUTO_COMPARE_LIMIT) {
          if (!autoCompareWarned) {
            autoCompareWarned = true;
            showToast('Live compare paused for large input — use the Compare button');
          }
          return;
        }
        clearTimeout(autoCompareTimer);
        autoCompareTimer = setTimeout(runDiff, 300);
      }
    });
  }

  viewToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    settings.view = btn.dataset.view;
    applySettingsToControls();
    afterRenderSettingChange();
  });

  modeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn || btn.dataset.mode === settings.mode) return;
    settings.mode = btn.dataset.mode;
    saveSettings();
    session.lastDiff = null;
    session.lastPatch = null;
    clearNotices();
    hideDiffArea();
    applyModeUI();
  });

  diffBtn.addEventListener('click', runDiff);

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runDiff();
    if (e.key === 'Escape') {
      if (!isInlineOptions()) settingsPopover.hidden = true;
      exportDropdown.hidden = true;
    }
  });

  clearBtn.addEventListener('click', () => {
    leftInput.value = '';
    rightInput.value = '';
    session.leftName = null;
    session.rightName = null;
    session.lastDiff = null;
    session.lastPatch = null;
    updateCounts();
    refreshFileChips();
    clearNotices();
    hideDiffArea();
    clearSavedInputs();
    leftInput.focus();
  });

  swapBtn.addEventListener('click', () => {
    const tmpVal = leftInput.value;
    leftInput.value = rightInput.value;
    rightInput.value = tmpVal;
    const tmpName = session.leftName;
    session.leftName = session.rightName;
    session.rightName = tmpName;
    updateCounts();
    refreshFileChips();
    saveInputs();
    if (diffArea.classList.contains('visible')) runDiff();
  });

  // ── Settings popover ──
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPopover.hidden = !settingsPopover.hidden;
    exportDropdown.hidden = true;
  });
  settingsPopover.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => {
    if (!isInlineOptions()) settingsPopover.hidden = true;
    exportDropdown.hidden = true;
  });

  wideOptionsQuery.addEventListener('change', syncOptionsBar);

  settingsPopover.querySelectorAll('[data-gran]').forEach(btn => {
    btn.addEventListener('click', () => {
      settings.granularity = btn.dataset.gran;
      applySettingsToControls();
      afterComputeSettingChange();
    });
  });

  document.getElementById('optWhitespace').addEventListener('change', (e) => {
    settings.ignoreWhitespace = e.target.value;
    afterComputeSettingChange();
  });
  document.getElementById('optIgnoreCase').addEventListener('change', (e) => {
    settings.ignoreCase = e.target.checked;
    afterComputeSettingChange();
  });
  document.getElementById('optDetectMoves').addEventListener('change', (e) => {
    settings.detectMoves = e.target.checked;
    afterComputeSettingChange();
  });
  document.getElementById('optIgnoreComments').addEventListener('change', (e) => {
    settings.ignoreComments = e.target.checked;
    afterComputeSettingChange();
  });
  document.getElementById('optAutoCompare').addEventListener('change', (e) => {
    settings.autoCompare = e.target.checked;
    saveSettings();
  });
  document.getElementById('optCollapse').addEventListener('change', (e) => {
    settings.collapseUnchanged = e.target.checked;
    afterRenderSettingChange();
  });
  document.getElementById('optSyncScroll').addEventListener('change', (e) => {
    settings.syncInputScroll = e.target.checked;
    saveSettings();
  });
  document.getElementById('optContext').addEventListener('change', (e) => {
    let n = parseInt(e.target.value, 10);
    if (!Number.isFinite(n)) n = 3;
    n = Math.max(1, Math.min(10, n));
    e.target.value = n;
    settings.contextLines = n;
    afterRenderSettingChange();
  });
  langSelect.addEventListener('change', () => {
    settings.language = langSelect.value;
    afterComputeSettingChange();
  });

  langChip.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!isInlineOptions()) settingsPopover.hidden = false;
    langSelect.focus();
  });

  // ── Export dropdown ──
  exportBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    exportDropdown.hidden = !exportDropdown.hidden;
    settingsPopover.hidden = true;
  });
  exportDropdown.addEventListener('click', (e) => {
    e.stopPropagation();
    const item = e.target.closest('[data-export]');
    if (!item) return;
    exportDropdown.hidden = true;
    const action = item.dataset.export;
    if (action === 'share') { exportShareLink(); return; }
    if (!session.lastDiff) {
      showToast(settings.mode === 'patch'
        ? 'Patch export is for compare modes — switch to Text or JSON'
        : 'Run a compare first');
      return;
    }
    if (action === 'copy-patch') exportCopyPatch();
    else if (action === 'download-patch') exportDownloadPatch();
    else if (action === 'report') exportHtmlReport();
  });

  // ── Expand collapsed regions / jump between move partners ──
  diffScroll.addEventListener('click', (e) => {
    const row = e.target.closest('.diff-row-collapse');
    if (row) {
      const id = row.dataset.collapseId;
      diffScroll.querySelectorAll('[data-collapse-id="' + CSS.escape(id) + '"]').forEach(el => {
        if (el.classList.contains('diff-row-collapse')) el.remove();
        else el.classList.remove('collapse-hidden');
      });
      updateMinimap();
      return;
    }
    const moveRow = e.target.closest('tr[data-move-partner]');
    if (moveRow) {
      const partner = diffScroll.querySelector(
        '[data-move-row="' + CSS.escape(moveRow.dataset.movePartner) + '"]');
      if (partner) {
        partner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        flashRow(partner);
      }
    }
  });
}

// ── Share-link loading ──
async function loadFromHash(hash) {
  try {
    const payload = await decodeSharePayload(hash.slice(1));
    if (!payload || typeof payload !== 'object') throw new Error('bad payload');
    leftInput.value = typeof payload.l === 'string' ? payload.l : '';
    rightInput.value = typeof payload.r === 'string' ? payload.r : '';
    session.leftName = typeof payload.ln === 'string' ? payload.ln : null;
    session.rightName = typeof payload.rn === 'string' ? payload.rn : null;
    if (payload.s && typeof payload.s === 'object') {
      for (const key of ['mode', 'view', 'granularity', 'ignoreWhitespace', 'ignoreCase', 'language', 'detectMoves', 'ignoreComments']) {
        if (key in payload.s) settings[key] = payload.s[key];
      }
    }
    session.suppressInputSave = true; // don't clobber saved inputs until the user edits
    applySettingsToControls();
    applyModeUI();
    updateCounts();
    refreshFileChips();
    runDiff();
  } catch (e) {
    showToast(e && e.message === 'This link requires a newer browser'
      ? e.message : 'Could not read this share link');
    history.replaceState(null, '', location.pathname + location.search);
    restoreInputs();
    updateCounts();
    refreshFileChips();
  }
}

// ── Init ──
function init() {
  loadSettings();
  populateLanguageSelect();
  applySettingsToControls();
  applyModeUI();
  setupFileHandling();
  setupUiExtras();
  setupMainEvents();
  syncOptionsBar();

  const hash = location.hash;
  if (hash.startsWith('#d=') || hash.startsWith('#du=')) {
    loadFromHash(hash);
  } else {
    restoreInputs();
    updateCounts();
    refreshFileChips();
  }
  leftInput.focus();
}

init();

})();
